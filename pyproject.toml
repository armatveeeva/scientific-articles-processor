[tool.poetry]
name = "scientific-articles-processor"
version = "0.1.0"
description = "Pipeline for processing scientific articles and extracting chemical entities."
authors = ["Anastasiia Matveeva <aanmattv@gmail.com>"]
readme = "README.md"
packages = [{ include = "articles_processor", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
yake = ">=0.4.8"
pydantic = "^2.0"
pydantic-settings = "^2.0"
# Примечание: chemdataextractor добавлен в Dockerfile, так как его зависимость dawg
# не компилируется на macOS Apple Silicon с Python 3.11+.

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
mypy = "^1.11.0"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=articles_processor"
